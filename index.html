<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global New Year Countdown</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
            padding: 20px 0;
        }

        h1 {
            font-size: 3em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .subtitle {
            font-size: 1.2em;
            opacity: 0.9;
        }

        .detected-timezone {
            text-align: center;
            margin-top: 10px;
            font-size: 0.9em;
            opacity: 0.8;
        }

        .controls {
            text-align: center;
            margin-bottom: 30px;
        }

        .add-city-btn {
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.5);
            color: white;
            padding: 12px 24px;
            font-size: 1em;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .add-city-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 30px;
            border-radius: 15px;
            max-width: 500px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        }

        .modal-header {
            font-size: 1.5em;
            margin-bottom: 20px;
            font-weight: bold;
        }

        .search-input {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            font-size: 1em;
            backdrop-filter: blur(10px);
        }

        .search-input::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }

        .search-input:focus {
            outline: none;
            border-color: rgba(255, 255, 255, 0.6);
            background: rgba(255, 255, 255, 0.15);
        }

        .city-list {
            display: grid;
            gap: 10px;
            margin-bottom: 20px;
        }

        .city-option {
            background: rgba(255, 255, 255, 0.1);
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            border: 2px solid transparent;
        }

        .city-option:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.5);
        }

        .modal-close {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
            padding: 10px 20px;
            font-size: 1em;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .modal-close:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .delete-btn {
            background: rgba(255, 59, 48, 0.8);
            border: none;
            color: white;
            padding: 5px 10px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.8em;
            margin-top: 10px;
            transition: all 0.3s ease;
        }

        .delete-btn:hover {
            background: rgba(255, 59, 48, 1);
        }

        .timezone-card.user-timezone .delete-btn {
            display: none;
        }

        .message {
            text-align: center;
            font-size: 1.5em;
            padding: 40px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            backdrop-filter: blur(10px);
        }

        .user-timezone-section {
            margin-bottom: 30px;
        }

        .other-timezones-label {
            font-size: 1.2em;
            font-weight: bold;
            margin-bottom: 15px;
            opacity: 0.9;
        }

        .timezone-list {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .timezone-card {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
            border: 1px solid rgba(255, 255, 255, 0.18);
            transition: transform 0.3s ease;
        }

        .timezone-card:hover {
            transform: translateY(-5px);
        }

        .timezone-card.user-timezone {
            background: rgba(255, 215, 0, 0.3);
            border: 3px solid rgba(255, 215, 0, 0.8);
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.4);
        }

        .timezone-name {
            font-size: 1.3em;
            font-weight: bold;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .user-badge {
            background: #FFD700;
            color: #333;
            padding: 3px 8px;
            border-radius: 5px;
            font-size: 0.6em;
            font-weight: bold;
        }

        .countdown {
            font-size: 2em;
            font-weight: bold;
            text-align: center;
            margin: 15px 0;
            font-family: 'Courier New', monospace;
        }

        .countdown-label {
            font-size: 0.5em;
            opacity: 0.8;
            display: block;
            margin-top: 5px;
        }

        .celebration {
            font-size: 1.2em;
            text-align: center;
            color: #FFD700;
            font-weight: bold;
        }

        .local-time {
            text-align: center;
            opacity: 0.8;
            font-size: 0.9em;
            margin-top: 10px;
        }

        /* Confetti styles */
        .confetti {
            position: fixed;
            width: 10px;
            height: 10px;
            background: #f0f;
            animation: confetti-fall 3s linear forwards;
        }

        @keyframes confetti-fall {
            to {
                transform: translateY(100vh) rotate(360deg);
                opacity: 0;
            }
        }

        .confetti-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 9999;
        }

        /* Notification popup styles */
        .notification-popup {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px 30px;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            font-size: 1.2em;
            font-weight: bold;
            z-index: 10000;
            animation: slideDown 0.5s ease-out;
            border: 2px solid rgba(255, 215, 0, 0.8);
            backdrop-filter: blur(10px);
            text-align: center;
            max-width: 90%;
        }

        @keyframes slideDown {
            from {
                transform: translateX(-50%) translateY(-150%);
                opacity: 0;
            }
            to {
                transform: translateX(-50%) translateY(0);
                opacity: 1;
            }
        }

        .notification-popup.fade-out {
            animation: fadeOut 0.5s ease-out forwards;
        }

        @keyframes fadeOut {
            from {
                opacity: 1;
            }
            to {
                opacity: 0;
                transform: translateX(-50%) translateY(-20px);
            }
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 2em;
            }

            .timezone-list {
                grid-template-columns: 1fr;
            }

            .countdown {
                font-size: 1.5em;
            }
        }
    </style>
</head>

        // Get user's selected cities from localStorage
        function getSelectedCities() {
            try {
                const stored = localStorage.getItem('selectedCities');
                if (stored) {
                    return JSON.parse(stored);
                }
            } catch (e) {
                console.error('Error reading localStorage:', e);
            }
            
            // Default: user timezone + 2 others (New York and Tokyo)
            const userTz = getUserTimezone();
            const defaults = [userTz];
            
            // Add New York if not user's timezone
            if (userTz !== 'America/New_York') {
                defaults.push('America/New_York');
            }
            
            // Add Tokyo if not user's timezone
            if (userTz !== 'Asia/Tokyo') {
                defaults.push('Asia/Tokyo');
            }
            
            // If user is in both NY and Tokyo (impossible but safe), add London
            if (defaults.length === 1) {
                defaults.push('Europe/London');
            }
            
            return defaults;
        }

        // Save selected cities to localStorage
        function saveSelectedCities(cities) {
            localStorage.setItem('selectedCities', JSON.stringify(cities));
        }

        // Add a city
        function addCity(timezone) {
            const selected = getSelectedCities();
            if (!selected.includes(timezone)) {
                selected.push(timezone);
                saveSelectedCities(selected);
                renderTimezones();
            }
            closeCityModal();
        }

        // Remove a city
        function removeCity(timezone) {
            const selected = getSelectedCities();
            const filtered = selected.filter(tz => tz !== timezone);
            saveSelectedCities(filtered);
            renderTimezones();
        }

        // Open city modal
        function openCityModal() {
            const modal = document.getElementById('cityModal');
            const searchInput = document.getElementById('citySearch');
            
            // Reset search input
            searchInput.value = '';
            
            // Populate city list
            populateCityList();
            
            modal.classList.add('show');
            
            // Focus on search input for better UX
            setTimeout(() => searchInput.focus(), 100);
        }

        // Populate city list
        function populateCityList(searchTerm = '') {
            const cityList = document.getElementById('cityList');
            const selected = getSelectedCities();
            
            cityList.innerHTML = '';
            
            // Filter cities based on search term
            const filteredTimezones = availableTimezones.filter(tz => 
                tz.name.toLowerCase().includes(searchTerm.toLowerCase())
            );
            
            filteredTimezones.forEach(tz => {
                const isSelected = selected.includes(tz.zone);
                const div = document.createElement('div');
                div.className = 'city-option';
                div.textContent = `${tz.name} ${isSelected ? '✓' : ''}`;
                if (!isSelected) {
                    div.onclick = () => addCity(tz.zone);
                } else {
                    div.style.opacity = '0.5';
                    div.style.cursor = 'default';
                }
                cityList.appendChild(div);
            });
        }

        // Filter cities based on search input
        function filterCities() {
            const searchInput = document.getElementById('citySearch');
            populateCityList(searchInput.value);
        }

        // Close city modal
        function closeCityModal() {
            const modal = document.getElementById('cityModal');
            modal.classList.remove('show');
        }

        // Get friendly timezone name
        function getFriendlyTimezoneName(timezone) {
            const found = availableTimezones.find(tz => tz.zone === timezone);
            if (found) return found.name;
            
            // If not in our list, format the timezone nicely
            return timezone.replace(/_/g, ' ').split('/').pop();
        }

        function isDecember31stOrJanuary1st() {
            // Cache the result for 1 minute to avoid creating Date objects too frequently
            // Shorter cache duration to handle date transitions better
            const now = Date.now();
            const cacheExpired = now - lastDateCheckTime >= DATE_CHECK_CACHE_DURATION;
            
            if (cachedIsNYEorNYD !== null && !cacheExpired) {
                return cachedIsNYEorNYD;
            }
            
            const date = new Date();
            const month = date.getMonth(); // 0-indexed
            const day = date.getDate();
            
            // December is month 11, January is month 0
            const isNYEorNYD = (month === 11 && day === 31) || (month === 0 && day === 1);
            
            // Reset notification tracking when transitioning away from celebration period
            if (cachedIsNYEorNYD === true && isNYEorNYD === false) {
                offScreenNotificationsShown.clear();
                confettiShown.clear();
            }
            
            cachedIsNYEorNYD = isNYEorNYD;
            lastDateCheckTime = now;
            
            return cachedIsNYEorNYD;
        }

        function getTimeInTimezone(timezone) {
            try {
                // Get current time components in the target timezone
                // Note: We extract the date/time components (year, month, day, hour, etc.) from the target timezone
                // and create a local Date object with those values. This is intentional - we only use this Date
                // to extract and compare the COMPONENTS (e.g., "is it Dec 31 or Jan 1?", "what hour is it?"),
                // not for absolute time calculations. All absolute time calculations are done in getNextNewYear()
                // which properly handles UTC conversion.
                const formatter = new Intl.DateTimeFormat('en-US', {
                    timeZone: timezone,
                    year: 'numeric',
                    month: '2-digit',
                    day: '2-digit',
                    hour: '2-digit',
                    minute: '2-digit',
                    second: '2-digit',
                    hour12: false
                });
                
                const parts = formatter.formatToParts(new Date());
                const year = parseInt(parts.find(p => p.type === 'year').value);
                const month = parseInt(parts.find(p => p.type === 'month').value) - 1; // 0-indexed
                const day = parseInt(parts.find(p => p.type === 'day').value);
                const hour = parseInt(parts.find(p => p.type === 'hour').value);
                const minute = parseInt(parts.find(p => p.type === 'minute').value);
                const second = parseInt(parts.find(p => p.type === 'second').value);
                
                // Create a Date object representing this time
                return new Date(year, month, day, hour, minute, second);
            } catch (e) {
                console.error('Error getting time in timezone:', e);
                return null;
            }
        }

        function getNextNewYear(timezone) {
            const now = getTimeInTimezone(timezone);
            if (!now) return null;

            const year = now.getFullYear();
            const month = now.getMonth();
            const date = now.getDate();
            const hours = now.getHours();
            const minutes = now.getMinutes();
            
            // Determine which New Year we're counting down to
            // If it's Dec 31st, count to next year's Jan 1
            // If it's Jan 1st and within 10 minutes after midnight, count to current year's Jan 1
            // If it's Jan 1st and more than 10 minutes after midnight, count to next year's Jan 1
            // If it's Jan 1st and after noon, we should have switched to "see you next Dec 31" mode
            let newYearYear;
            if (month === 11 && date === 31) {
                // December 31st - count to next year
                newYearYear = year + 1;
            } else if (month === 0 && date === 1) {
                // January 1st
                const totalMinutesSinceMidnight = hours * 60 + minutes;
                if (totalMinutesSinceMidnight <= CELEBRATION_DURATION_MINUTES) {
                    // Within celebration window after midnight - count to current year (for celebration message)
                    newYearYear = year;
                } else {
                    // More than celebration window after midnight - count to next year
                    newYearYear = year + 1;
                }
            } else {
                // Any other date (shouldn't happen due to date restriction)
                newYearYear = year + 1;
            }
            
            // Find the exact UTC moment when it's midnight (00:00:00) in the target timezone
            // We search within a reasonable range of UTC offsets
            for (let i = -12; i <= 14; i++) {
                const testTime = new Date(Date.UTC(newYearYear, 0, 1, -i, 0, 0));
                
                // Get the time components in the target timezone for this UTC moment
                const formatter = new Intl.DateTimeFormat('en-US', {
                    timeZone: timezone,
                    year: 'numeric',
                    month: '2-digit',
                    day: '2-digit',
                    hour: '2-digit',
                    minute: '2-digit',
                    second: '2-digit',
                    hour12: false
                });
                
                const parts = formatter.formatToParts(testTime);
                const testYear = parseInt(parts.find(p => p.type === 'year').value);
                const testMonth = parseInt(parts.find(p => p.type === 'month').value) - 1; // 0-indexed
                const testDay = parseInt(parts.find(p => p.type === 'day').value);
                const testHour = parseInt(parts.find(p => p.type === 'hour').value);
                
                // Check for midnight (hour 0 or 24) on January 1st of the target year
                // Note: Intl.DateTimeFormat with hour12:false can return 24 for midnight at the start
                // of a new day (e.g., "01/01/2026, 24:00:00" for the exact moment of transition).
                // This has been verified through testing and is standard ISO 8601 behavior.
                if ((testHour === 0 || testHour === 24) && testMonth === 0 && testDay === 1 && testYear === newYearYear) {
                    return testTime;
                }
            }
            
            // Fallback to UTC midnight if we can't find the exact time
            return new Date(Date.UTC(newYearYear, 0, 1, 0, 0, 0));
        }

        function formatCountdown(milliseconds, timezone) {
            // If negative (past midnight), check if within celebration window
            if (milliseconds <= 0) {
                const secondsPast = Math.abs(milliseconds) / 1000;
                const minutesPast = secondsPast / 60;
                if (minutesPast <= CELEBRATION_DURATION_MINUTES) {
                    // Just hit midnight if within trigger window
                    return { display: '🎊 HAPPY NEW YEAR! 🎊', isCelebrating: true, justHitMidnight: secondsPast <= CONFETTI_TRIGGER_SECONDS };
                }
                // If more than celebration duration past, the getNextNewYear should have switched to next year
                // So this should show a normal countdown
            }

            const seconds = Math.floor(milliseconds / 1000);
            const minutes = Math.floor(seconds / 60);
            const hours = Math.floor(minutes / 60);
            const days = Math.floor(hours / 24);

            const displayHours = hours % 24;
            const displayMinutes = minutes % 60;
            const displaySeconds = seconds % 60;

            const parts = [];
            if (days > 0) parts.push(`${days}d`);
            parts.push(`${displayHours.toString().padStart(2, '0')}h`);
            parts.push(`${displayMinutes.toString().padStart(2, '0')}m`);
            parts.push(`${displaySeconds.toString().padStart(2, '0')}s`);

            return { display: parts.join(' '), isCelebrating: false, justHitMidnight: false };
        }

        function getUserTimezone() {
            return Intl.DateTimeFormat().resolvedOptions().timeZone;
        }

        // Create confetti effect
        function createConfetti() {
            const container = document.getElementById('confettiContainer');
            const colors = ['#ff0000', '#00ff00', '#0000ff', '#ffff00', '#ff00ff', '#00ffff', '#ffa500'];
            
            for (let i = 0; i < 100; i++) {
                setTimeout(() => {
                    const confetti = document.createElement('div');
                    confetti.className = 'confetti';
                    confetti.style.left = Math.random() * 100 + '%';
                    confetti.style.top = '-10px';
                    confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                    const delay = Math.random() * 0.5;
                    confetti.style.animationDelay = delay + 's';
                    const duration = Math.random() * 2 + 2; // 2-4 seconds
                    confetti.style.animationDuration = duration + 's';
                    container.appendChild(confetti);
                    
                    // Remove confetti after animation completes (duration + delay in milliseconds)
                    setTimeout(() => confetti.remove(), (duration + delay) * 1000);
                }, i * 30);
            }
        }

        // Show notification popup for a city
        // Note: Popup timeouts are not stored since this is a single-page app
        // that typically stays open for the entire celebration period
        function showNotificationPopup(cityName) {
            // Create popup element
            const popup = document.createElement('div');
            popup.className = 'notification-popup';
            popup.textContent = `🎉 Happy New Year to ${cityName}! 🎉`;
            document.body.appendChild(popup);
            
            // Auto-dismiss after configured duration
            setTimeout(() => {
                popup.classList.add('fade-out');
                setTimeout(() => popup.remove(), FADE_OUT_DURATION);
            }, NOTIFICATION_DISPLAY_DURATION);
        }

        // Update tab title with city celebration
        // Note: Only the most recent city's title will be shown if multiple cities
        // hit midnight simultaneously. This is intentional to avoid title conflicts.
        function updateTabTitle(cityName) {
            document.title = `🎊 Happy New Year to ${cityName}! 🎊`;
            
            // Restore original title after configured duration
            setTimeout(() => {
                document.title = originalTitle;
            }, TAB_TITLE_DURATION);
        }

        // Track which timezones have already shown confetti
        const confettiShown = new Set();
        
        // Track which off-screen cities have already triggered notifications
        const offScreenNotificationsShown = new Set();
        
        // Store the original page title
        const originalTitle = document.title;
        
        // Cache the date check to avoid creating Date objects on every update
        let cachedIsNYEorNYD = null;
        let lastDateCheckTime = 0;

        // Check if all cities have passed noon on January 1st
        function allCitiesPassedNoon() {
            const selectedCities = getSelectedCities();
            
            for (const cityZone of selectedCities) {
                const cityTime = getTimeInTimezone(cityZone);
                if (!cityTime) continue;
                
                const month = cityTime.getMonth();
                const date = cityTime.getDate();
                const hours = cityTime.getHours();
                
                // If any city is not on Jan 1st, or is on Jan 1st before noon, return false
                if (month !== 0 || date !== 1 || hours < 12) {
                    return false;
                }
            }
            
            return true;
        }

        // Check if time remaining is within the window for midnight notifications
        function isWithinMidnightCheckWindow(timeRemaining) {
            // Check negative times (after midnight) up to the trigger window to catch the celebration period
            // Check positive times (before midnight) up to MIDNIGHT_CHECK_WINDOW_MS
            return timeRemaining <= MIDNIGHT_CHECK_WINDOW_MS && 
                   timeRemaining >= -(CONFETTI_TRIGGER_SECONDS * 1000);
        }

        // Check for off-screen cities that have just passed midnight
        function checkOffScreenCitiesMidnight() {
            if (!isDecember31stOrJanuary1st()) return;
            
            const selectedCities = getSelectedCities();
            const now = Date.now();
            
            // Optimization: Only check timezones that haven't been notified yet
            availableTimezones.forEach(tz => {
                const timezone = tz.zone;
                const cityName = tz.name;
                
                // Skip if this city is currently displayed
                if (selectedCities.includes(timezone)) return;
                
                // Skip if we've already shown notification for this city
                if (offScreenNotificationsShown.has(timezone)) return;
                
                // Get the next New Year for this timezone
                const newYear = getNextNewYear(timezone);
                if (!newYear) return;
                
                const timeRemaining = newYear.getTime() - now;
                
                // Quick filter: Only check cities within the configured window
                // This avoids expensive formatCountdown calls for cities far from midnight
                if (!isWithinMidnightCheckWindow(timeRemaining)) return;
                
                const countdown = formatCountdown(timeRemaining, timezone);
                
                // If this city just hit midnight (within the trigger window)
                if (countdown.justHitMidnight) {
                    // Mark as shown
                    offScreenNotificationsShown.add(timezone);
                    
                    // Show confetti
                    createConfetti();
                    
                    // Update tab title
                    updateTabTitle(cityName);
                    
                    // Show popup notification
                    showNotificationPopup(cityName);
                }
            });
        }

        // Get next December 31st in user's timezone
        function getNextDec31() {
            const userTz = getUserTimezone();
            const now = getTimeInTimezone(userTz);
            if (!now) return null;
            
            const year = now.getFullYear();
            const month = now.getMonth();
            const date = now.getDate();
            
            // If we're on Jan 1st after all cities passed noon, count to this year's Dec 31
            // Otherwise count to next year's Dec 31
            let targetYear = year;
            if (month !== 0 || date !== 1) {
                // Not on Jan 1st, so target this year's Dec 31 or next year if already past
                if (month === 11 && date === 31) {
                    targetYear = year + 1;
                }
            }
            
            // Find exact UTC moment for Dec 31 00:00:00 in user's timezone
            for (let i = -12; i <= 14; i++) {
                const testTime = new Date(Date.UTC(targetYear, 11, 31, -i, 0, 0));
                const testTimeInTz = new Date(testTime.toLocaleString('en-US', { timeZone: userTz }));
                const testHour = testTimeInTz.getHours();
                const testMonth = testTimeInTz.getMonth();
                const testDay = testTimeInTz.getDate();
                const testYear = testTimeInTz.getFullYear();
                
                if (testHour === 0 && testMonth === 11 && testDay === 31 && testYear === targetYear) {
                    return testTime;
                }
            }
            
            // Fallback
            return new Date(Date.UTC(targetYear, 11, 31, 0, 0, 0));
        }

        function renderTimezones() {
            const contentDiv = document.getElementById('content');
            const detectedTzDiv = document.getElementById('detected-tz');
            const userTimezone = getUserTimezone();
            
            // Display detected city name instead of timezone ID
            const userCityName = getFriendlyTimezoneName(userTimezone);
            detectedTzDiv.textContent = `Your location: ${userCityName}`;
            
            if (!isDecember31stOrJanuary1st()) {
                contentDiv.innerHTML = `
                    <div class="message">
                        <p>🗓️ The Global New Year Countdown is only available on December 31st and January 1st.</p>
                        <p style="margin-top: 20px; font-size: 0.8em;">Come back during the New Year celebration!</p>
                    </div>
                `;
                return;
            }

            // Check if all cities have passed noon on January 1st
            if (allCitiesPassedNoon()) {
                const nextDec31 = getNextDec31();
                if (nextDec31) {
                    const now = Date.now();
                    const timeRemaining = nextDec31.getTime() - now;
                    const countdown = formatCountdown(timeRemaining, userTimezone);
                    
                    contentDiv.innerHTML = `
                        <div class="message">
                            <p>👋 See you next December 31st!</p>
                            <div class="countdown" style="margin-top: 20px;">${countdown.display}</div>
                            <p style="margin-top: 10px; font-size: 0.8em;">until the next New Year's Eve</p>
                        </div>
                    `;
                }
                return;
            }

            const selectedCities = getSelectedCities();
            const now = Date.now();

            // Build timezone objects for selected cities
            const timezonesToDisplay = selectedCities.map(tzZone => {
                return {
                    name: getFriendlyTimezoneName(tzZone),
                    zone: tzZone
                };
            });

            // Sort: user timezone first, then by how close to New Year
            const sortedTimezones = timezonesToDisplay.sort((a, b) => {
                const aIsUser = a.zone === userTimezone;
                const bIsUser = b.zone === userTimezone;
                
                if (aIsUser && !bIsUser) return -1;
                if (!aIsUser && bIsUser) return 1;
                
                const aNewYear = getNextNewYear(a.zone);
                const bNewYear = getNextNewYear(b.zone);
                
                if (!aNewYear || !bNewYear) return 0;
                
                const aTime = aNewYear.getTime() - now;
                const bTime = bNewYear.getTime() - now;
                
                return aTime - bTime;
            });

            // Separate user timezone from others
            const userTz = sortedTimezones.find(tz => tz.zone === userTimezone);
            const otherTimezones = sortedTimezones.filter(tz => tz.zone !== userTimezone);

            contentDiv.innerHTML = '';

            // Render user timezone section
            if (userTz) {
                const userSection = document.createElement('div');
                userSection.className = 'user-timezone-section';
                
                const userCard = createTimezoneCard(userTz, userTimezone, now, true);
                userSection.appendChild(userCard);
                contentDiv.appendChild(userSection);
            }

            // Render other timezones section
            if (otherTimezones.length > 0) {
                const otherLabel = document.createElement('div');
                otherLabel.className = 'other-timezones-label';
                otherLabel.textContent = 'Other Locations';
                contentDiv.appendChild(otherLabel);

                const timezoneList = document.createElement('div');
                timezoneList.className = 'timezone-list';
                
                otherTimezones.forEach(tz => {
                    const card = createTimezoneCard(tz, userTimezone, now, false);
                    if (card) timezoneList.appendChild(card);
                });
                
                contentDiv.appendChild(timezoneList);
            }
        }

        function createTimezoneCard(tz, userTimezone, now, isUserTz) {
            const newYear = getNextNewYear(tz.zone);
            if (!newYear) return null;
            
            const timeRemaining = newYear.getTime() - now;
            const countdown = formatCountdown(timeRemaining, tz.zone);
            
            // Trigger confetti if just hit midnight
            if (countdown.justHitMidnight && !confettiShown.has(tz.zone)) {
                confettiShown.add(tz.zone);
                createConfetti();
            }
            
            // Display current time in the target timezone
            const localTimeStr = new Date().toLocaleString('en-US', {
                timeZone: tz.zone,
                month: 'short',
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit',
                hour12: true
            });

            // Create card element
            const card = document.createElement('div');
            card.className = `timezone-card ${isUserTz ? 'user-timezone' : ''}`;
            card.setAttribute('data-timezone', tz.zone);
            
            // Create timezone name
            const nameDiv = document.createElement('div');
            nameDiv.className = 'timezone-name';
            nameDiv.textContent = tz.name;
            
            if (isUserTz) {
                const badge = document.createElement('span');
                badge.className = 'user-badge';
                badge.textContent = 'YOUR TIMEZONE';
                nameDiv.appendChild(document.createTextNode(' '));
                nameDiv.appendChild(badge);
            }
            
            // Create countdown
            const countdownDiv = document.createElement('div');
            countdownDiv.className = `countdown ${countdown.isCelebrating ? 'celebration' : ''}`;
            countdownDiv.textContent = countdown.display;
            
            if (!countdown.isCelebrating) {
                const label = document.createElement('span');
                label.className = 'countdown-label';
                label.textContent = 'until New Year';
                countdownDiv.appendChild(document.createTextNode(' '));
                countdownDiv.appendChild(label);
            }
            
            // Create local time
            const localTimeDiv = document.createElement('div');
            localTimeDiv.className = 'local-time';
            localTimeDiv.textContent = localTimeStr;
            
            // Assemble card
            card.appendChild(nameDiv);
            card.appendChild(countdownDiv);
            card.appendChild(localTimeDiv);
            
            // Add remove button for non-user timezones
            if (!isUserTz) {
                const removeBtn = document.createElement('button');
                removeBtn.className = 'delete-btn';
                removeBtn.textContent = '🗑️ Remove';
                removeBtn.onclick = () => removeCity(tz.zone);
                card.appendChild(removeBtn);
            }
            
            return card;
        }

        function updateCountdowns() {
            // Check if all cities passed noon and re-render if so
            if (allCitiesPassedNoon()) {
                renderTimezones();
                return;
            }
            
            // Check for off-screen cities passing midnight
            checkOffScreenCitiesMidnight();
            
            const cards = document.querySelectorAll('.timezone-card');
            const now = Date.now();
            
            cards.forEach(card => {
                const timezone = card.getAttribute('data-timezone');
                const newYear = getNextNewYear(timezone);
                
                if (!newYear) return;
                
                const timeRemaining = newYear.getTime() - now;
                const countdown = formatCountdown(timeRemaining, timezone);
                
                // Trigger confetti if just hit midnight
                if (countdown.justHitMidnight && !confettiShown.has(timezone)) {
                    confettiShown.add(timezone);
                    createConfetti();
                }
                
                const countdownDiv = card.querySelector('.countdown');
                if (countdownDiv) {
                    if (countdown.isCelebrating) {
                        countdownDiv.className = 'countdown celebration';
                        countdownDiv.innerHTML = countdown.display;
                    } else {
                        countdownDiv.className = 'countdown';
                        countdownDiv.innerHTML = `${countdown.display}<span class="countdown-label">until New Year</span>`;
                    }
                }
                
                const localTimeDiv = card.querySelector('.local-time');
                if (localTimeDiv) {
                    // Display current time in the target timezone
                    const localTimeStr = new Date().toLocaleString('en-US', {
                        timeZone: timezone,
                        month: 'short',
                        day: 'numeric',
                        hour: '2-digit',
                        minute: '2-digit',
                        second: '2-digit',
                        hour12: true
                    });
                    localTimeDiv.textContent = localTimeStr;
                }
            });
        }

        // Initial render
        renderTimezones();

        // Update every second
        if (isDecember31stOrJanuary1st()) {
            setInterval(() => {
                // If we're showing the "See you next Dec 31" message, update it
                const contentDiv = document.getElementById('content');
                if (contentDiv.querySelector('.message') && allCitiesPassedNoon()) {
                    const nextDec31 = getNextDec31();
                    if (nextDec31) {
                        const now = Date.now();
                        const timeRemaining = nextDec31.getTime() - now;
                        const countdown = formatCountdown(timeRemaining, getUserTimezone());
                        
                        const countdownDiv = contentDiv.querySelector('.countdown');
                        if (countdownDiv && countdown) {
                            countdownDiv.textContent = countdown.display;
                        }
                    }
                } else {
                    updateCountdowns();
                }
            }, 1000);
        }
    </script>
